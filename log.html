<!doctype html><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>RAD DAD Log</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#060c13;color:#e6f0ff} .wrap{max-width:820px;margin:0 auto;padding:18px} h1{margin:0 0 6px 0;font-size:26px;letter-spacing:.4px} #head{opacity:.9;margin:4px 0 16px 0} .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px} label{font-size:13px;color:#a4b6cc;display:flex;flex-direction:column} input[type='date'],select,button{background:#0b1827;border:1px solid #23364a;border-radius:10px;color:#e6f0ff;font-size:14px;padding:10px 12px} input[type='date']{min-width:160px} select{min-width:170px} button{padding:10px 14px;margin-top:6px;cursor:pointer;border:0;background:#b5d100;color:#091019;font-weight:700} button:hover{filter:brightness(.95)} table{width:100%;border-collapse:collapse;margin-top:6px;background:rgba(10,20,32,.55);border:1px solid #122234;border-radius:12px;overflow:hidden} th,td{border-bottom:1px solid #122234;padding:10px;text-align:left} th{font-size:12px;color:#93a8c1;background:#091420} td input{width:100%;box-sizing:border-box;border-radius:10px;border:1px solid #23364a;background:#091825;color:#e6f0ff;font-size:14px;padding:8px 10px} td input::placeholder{color:#4f6780} .note{margin-top:10px;font-size:12px;color:#7891ae}</style><div class='wrap'><h1>RAD DAD Log</h1><div id='head'></div><div class='controls'><label>Date<input id='date' type='date' min='2026-05-01'></label><label>Day<select id='day'></select></label></div><table><thead><tr><th>Exercise</th><th style='width:40px'>Set</th><th>Weight</th><th>Reps</th></tr></thead><tbody id='tb'></tbody></table><button id='clear'>Clear day</button><div class='note'>Autosaves. 4 sets per exercise. Options prevent duplicates for the same day.</div></div><script>const LS='rad_dad_log_v6';let s=JSON.parse(localStorage.getItem(LS)||'{}');const base={plan:{'Mon + Push':['Bench','Incline DB','Triceps Push'],'Tue + Pull':['Pulldown','Cable Row','Curls'],'Wed + Legs':['Goblet Squat','DB RDL','Calves'],'Thu + Push':['DB Shoulder','Pulley Press','Laterals'],'Fri + Pull':['Pulldown','Seated Row','DB Row'],'Sat + Light':['Walk','Light Circuit','Core'],'Sun + Recovery':['Stretch','Walk','Core']},logs:{}};const dayList=['Mon + Push','Tue + Pull','Wed + Legs','Thu + Push','Fri + Pull','Sat + Light','Sun + Recovery'];const all=['Bench','Incline DB','Triceps Push','DB Shoulder','Pulley Press','Laterals','Pulldown','Seated Row','Cable Row','DB Row','Face Pull','Curls','Goblet Squat','DB RDL','Calves','Core','Walk','Light Circuit','Stretch'];function save(){localStorage.setItem(LS,JSON.stringify(s))}function pick(k,d){return (s[k]||{})[d]||(base[k]||{})[d]}function dateStr(d){return new Date(d).toISOString().slice(0,10)}function setHead(d){document.getElementById('head').textContent=new Date(d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'})}function setDefaults(){const today=dateStr(new Date());const de=document.getElementById('date');de.value=Date.parse(today)>=Date.parse('2026-05-01')?today:'2026-05-01';const daySel=document.getElementById('day');dayList.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;daySel.appendChild(o)});const thisDay=dayList[new Date().getDay()==0?6:new Date().getDay()-1];daySel.value=thisDay;render()}function render(){const d=document.getElementById('date').value||'2026-05-01';const daySel=document.getElementById('day');const day=daySel.value;setHead(d);const plan=pick('plan',day);if(!s.plan)s.plan={};if(!s.logs)s.logs={};if(!s.plan[day])s.plan[day]=plan.slice();if(!s.logs[day])s.logs[day]={};const logDay=s.logs[day];if(!logDay[d])logDay[d]=Array(plan.length).fill(0).map(()=>[ ['','',''], ['','',''], ['','',''], ['','',''] ]);const used=new Set((s.plan[day]||[]).filter(x=>x));const tb=document.getElementById('tb');tb.innerHTML='';plan.forEach((ex,i)=>{const rows=logDay[d][i];const tr=document.createElement('tr');const tdSel=document.createElement('td');const sel=document.createElement('select');sel.minWidth='180px';sel.value=ex||'';all.forEach(opt=>{const o=document.createElement('option');o.value=opt;o.textContent=opt;const isCurrent=(ex===opt);if(!isCurrent&&used.has(opt))o.disabled=true;sel.appendChild(o)});sel.onchange=ev=>{const v=ev.target.value;s.plan[day][i]=v;render();save()};tdSel.appendChild(sel);tr.appendChild(tdSel);const tdSet=document.createElement('td');tdSet.textContent='1';tr.appendChild(tdSet);const tdW=document.createElement('td');const iW=document.createElement('input');iW.placeholder='lbs';iW.value=rows[0][0];iW.oninput=ev=>{rows[0][0]=ev.target.value;save()};tdW.appendChild(iW);tr.appendChild(tdW);const tdR=document.createElement('td');const iR=document.createElement('input');iR.placeholder='reps';iR.value=rows[0][1];iR.oninput=ev=>{rows[0][1]=ev.target.value;save()};tdR.appendChild(iR);tr.appendChild(tdR);tb.appendChild(tr);for(let sidx=1;sidx<4;sidx++){const tr2=document.createElement('tr');const td1=document.createElement('td');tr2.appendChild(td1);const td2=document.createElement('td');td2.textContent=String(sidx+1);tr2.appendChild(td2);const tdw=document.createElement('td');const iw=document.createElement('input');iw.placeholder='lbs';iw.value=rows[sidx][0];iw.oninput=ev=>{rows[sidx][0]=ev.target.value;save()};tdw.appendChild(iw);tr2.appendChild(tdw);const tdr=document.createElement('td');const ir=document.createElement('input');ir.placeholder='reps';ir.value=rows[sidx][1];ir.oninput=ev=>{rows[sidx][1]=ev.target.value;save()};tdr.appendChild(ir);tr2.appendChild(tdr);tb.appendChild(tr2)}});}document.getElementById('date').onchange=()=>render();document.getElementById('day').onchange=()=>render();document.getElementById('clear').onclick=()=>{const d=document.getElementById('date').value;const day=document.getElementById('day').value;if(s.logs&&s.logs[day])delete s.logs[day][d];if(s.plan&&s.plan[day])s.plan[day]=base.plan[day].slice();save();render()};setDefaults();</script>
