<!doctype html><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><link rel='apple-touch-icon' sizes='512x512' href='data:image/svg+xml,%3Csvg%20xmlns%3D%22http://www.w3.org/2000/svg%22%20width%3D%22512%22%20height%3D%22512%22%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20fill%3D%22%2310131a%22/%3E%3Crect%20y%3D%22440%22%20width%3D%22512%22%20height%3D%2272%22%20fill%3D%22%23c4d200%22/%3E%3Ctext%20x%3D%2250%25%22%20y%3D%22290%22%20text-anchor%3D%22middle%22%20dominant-baseline%3D%22middle%22%20font-family%3D%22Georgia,%20Times%20New%20Roman,%20serif%22%20font-weight%3D%22900%22%20font-size%3D%22220%22%20fill%3D%22%23ffffff%22%3ERAD%3C/text%3E%3C/svg%3E'><title>RAD DAD Log</title><style>body{margin:0;font-family:'Californian FB',ui-serif,Georgia,'Times New Roman',serif;background:#10131a;color:#fff}.wrap{max-width:860px;margin:0 auto;padding:18px}header{text-align:center;margin-bottom:16px}h1{margin:0;font-size:30px;font-weight:900}#head{margin-top:6px;font-size:14px;color:#d9d9d9}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;justify-content:center;margin-bottom:14px}label{font-size:13px;color:#cfd2d6;display:flex;flex-direction:column;gap:6px}input[type=date],select,button{background:#1a202b;border:1px solid #2d3844;border-radius:12px;color:#fff;font-size:14px;padding:10px 12px}input[type=date]{min-width:170px}select{min-width:180px}button{padding:10px 14px;margin-top:6px;cursor:pointer;border:0;background:#c4d200;color:#0b1509;font-weight:900}table{width:100%;border-collapse:collapse;background:rgba(20,26,36,.66);border:1px solid #242f39;border-radius:14px;overflow:hidden}th,td{border-bottom:1px solid #242f39;padding:10px}th{font-size:12px;color:#d7dee6;background:#0f1620}th:nth-child(2){text-align:center}td:nth-child(2){text-align:center;color:#cfd2d6}td input{width:100%;box-sizing:border-box;border-radius:10px;border:1px solid #2d3844;background:#141b25;color:#fff;font-size:14px;padding:8px 10px}.note{margin-top:12px;font-size:12px;color:#aeb9c8;text-align:center}</style><div class='wrap'><header><h1>RAD DAD Log</h1><div id='head'></div></header><div class='controls'><label>Date<input id='date' type='date' min='2026-05-01'></label><label>Day<select id='day'></select></label><label>Type<select id='type'></select></label><label>Plan<select id='plan'></select></label></div><table><thead><tr><th>Exercise</th><th style='width:44px'>Set</th><th>Weight</th><th>Reps</th></tr></thead><tbody id='tb'></tbody></table><div style='display:flex;justify-content:center'><button id='clear'>Clear day</button></div><div class='note'>Autosaves. Plan toggles to opposite of last. No duplicates.</div></div><script>var LS='rad_dad_log_v8',s=JSON.parse(localStorage.getItem(LS)||'{}');s.last=s.last||{};s.by=s.by||{};s.logs=s.logs||{};var days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];var dayType={Mon:'Push',Tue:'Pull',Wed:'Legs',Thu:'Push',Fri:'Pull',Sat:'Light',Sun:'Recovery'};var plans={Push:{A:['Bench','Incline DB','Triceps Push','Laterals'],B:['DB Shoulder','Pulley Press','Triceps Push','Laterals']},Pull:{A:['Pulldown','Cable Row','DB Row','Curls'],B:['Pulldown','Seated Row','Face Pull','Curls']},Legs:{A:['Goblet Squat','DB RDL','Calves','Stepups'],B:['Goblet Squat','DB RDL','Calves','Lunges']},Light:{A:['Walk','Core','Light Circuit','Stretch'],B:['Walk','Core','Stretch','Light Circuit']},Recovery:{A:['Stretch','Walk','Core','Light Circuit'],B:['Walk','Stretch','Core','Light Circuit']}};var all=['Bench','Incline DB','Triceps Push','DB Shoulder','Pulley Press','Laterals','Pulldown','Seated Row','Cable Row','DB Row','Face Pull','Curls','Goblet Squat','DB RDL','Calves','Stepups','Lunges','Core','Walk','Light Circuit','Stretch'];function save(){localStorage.setItem(LS,JSON.stringify(s))}function toISO(d){return new Date(d).toISOString().slice(0,10)}function dayFromISO(iso){var d=new Date(iso).getDay();return days[d===0?6:d-1]}function defPlan(t){return s.last[t]==='A'?'B':'A'}function planArr(t,p){var a=(plans[t]||{})[p];return a?a.slice():['','','','']}function ensureISO(iso){if(!s.by[iso]){var day=dayFromISO(iso),type=dayType[day]||'Push',plan=defPlan(type);s.by[iso]={day:day,type:type,plan:plan,ex:planArr(type,plan)};}if(!s.by[iso].ex)s.by[iso].ex=planArr(s.by[iso].type,s.by[iso].plan);if(!s.logs[iso])s.logs[iso]=[0,1,2,3].map(()=>([['',''],['',''],['',''],['','']]))}function usedSet(a){var u=new Set();a.forEach(x=>{if(x)u.add(x)});return u}function resetPlan(iso,newPlan){ensureISO(iso);var by=s.by[iso];var oldEx=by.ex.slice();var oldLogs=s.logs[iso];var newEx=planArr(by.type,newPlan);var newLogs=[0,1,2,3].map(()=>([['',''],['',''],['',''],['','']]));for(var i=0;i<4;i++){if(oldEx[i]===newEx[i])newLogs[i]=oldLogs[i]}by.plan=newPlan;by.ex=newEx;s.logs[iso]=newLogs}function render(){var iso=document.getElementById('date').value||'2026-05-01';ensureISO(iso);var by=s.by[iso];by.day=dayFromISO(iso);document.getElementById('head').textContent=new Date(iso).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});document.getElementById('day').value=by.day;var typeSel=document.getElementById('type');if(typeSel.options.length===0)['Push','Pull','Legs','Light','Recovery'].forEach(t=>typeSel.add(new Option(t,t)));by.type=by.type||dayType[by.day]||'Push';typeSel.value=by.type;var planSel=document.getElementById('plan');planSel.innerHTML='';var dp=defPlan(by.type);['A','B'].forEach(p=>{var o=document.createElement('option');o.value=p;o.textContent='Plan '+p+(p===dp?' (default)':'');planSel.appendChild(o)});by.plan=by.plan||dp;planSel.value=by.plan;s.last[by.type]=by.plan;by.ex=by.ex||planArr(by.type,by.plan);var used=usedSet(by.ex);var tb=document.getElementById('tb');tb.innerHTML='';for(var i=0;i<4;i++){var tr=document.createElement('tr');var td=document.createElement('td');var sel=document.createElement('select');all.forEach(opt=>{var o=new Option(opt,opt);if(by.ex[i]!==opt&&used.has(opt))o.disabled=true;sel.add(o)});sel.value=by.ex[i]||'';sel.onchange=e=>{by.ex[i]=e.target.value;save();render()};td.appendChild(sel);tr.appendChild(td);var tdSet=document.createElement('td');tdSet.textContent='1';tr.appendChild(tdSet);var tdW=document.createElement('td');var w=document.createElement('input');w.placeholder='lbs';w.value=s.logs[iso][i][0][0];w.oninput=e=>{s.logs[iso][i][0][0]=e.target.value;save()};tdW.appendChild(w);tr.appendChild(tdW);var tdR=document.createElement('td');var r=document.createElement('input');r.placeholder='reps';r.value=s.logs[iso][i][0][1];r.oninput=e=>{s.logs[iso][i][0][1]=e.target.value;save()};tdR.appendChild(r);tr.appendChild(tdR);tb.appendChild(tr);for(var set=1;set<4;set++){var tr2=document.createElement('tr');var t1=document.createElement('td');t1.style.background='rgba(0,0,0,0)';tr2.appendChild(t1);var t2=document.createElement('td');t2.textContent=String(set+1);tr2.appendChild(t2);var tW=document.createElement('td');var wi=document.createElement('input');wi.placeholder='lbs';wi.value=s.logs[iso][i][set][0];wi.oninput=e=>{s.logs[iso][i][set][0]=e.target.value;save()};tW.appendChild(wi);tr2.appendChild(tW);var tR=document.createElement('td');var ri=document.createElement('input');ri.placeholder='reps';ri.value=s.logs[iso][i][set][1];ri.oninput=e=>{s.logs[iso][i][set][1]=e.target.value;save()};tR.appendChild(ri);tr2.appendChild(tR);tb.appendChild(tr2)}}}document.getElementById('date').onchange=render;document.getElementById('day').onchange=()=>{var iso=document.getElementById('date').value||'2026-05-01';ensureISO(iso);s.by[iso].day=document.getElementById('day').value;s.by[iso].type=dayType[s.by[iso].day]||s.by[iso].type;save();render()};document.getElementById('type').onchange=()=>{var iso=document.getElementById('date').value||'2026-05-01';ensureISO(iso);var t=document.getElementById('type').value;if(s.by[iso].type===t){render();return}s.by[iso].type=t;var plan=defPlan(t);s.by[iso].plan=plan;s.by[iso].ex=planArr(t,plan);s.logs[iso]=[0,1,2,3].map(()=>([['',''],['',''],['',''],['','']]));save();render()};document.getElementById('plan').onchange=()=>{var iso=document.getElementById('date').value||'2026-05-01';resetPlan(iso,document.getElementById('plan').value);save();render()};document.getElementById('clear').onclick=()=>{var iso=document.getElementById('date').value||'2026-05-01';delete s.by[iso];delete s.logs[iso];save();render()};(function(){var de=document.getElementById('date'),today=toISO(new Date()),min='2026-05-01';de.value=Date.parse(today)>=Date.parse(min)?today:min;var daySel=document.getElementById('day');days.forEach(v=>daySel.add(new Option(v,v)));render()})()</script>
