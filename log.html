<!doctype html><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>RAD DAD Log</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0b0f14;color:#e9eef7} .w{max-width:720px;margin:0 auto;padding:14px} h1{margin:0;font-size:18px} .s{font-size:12px;color:#99a7ba;margin:6px 0 12px} label{font-size:12px;margin-right:10px} input,select{background:#0f1823;border:1px solid #1e2d3f;border-radius:10px;color:#e9eef7;padding:10px;font-size:13px} table{width:100%;border-collapse:collapse;margin-top:12px} th,td{border:1px solid #1c2838;padding:8px;font-size:13px} th{background:#101a26;color:#cfd8ea;text-align:left} .x{min-width:170px} .set{width:36px;text-align:center;background:#0f1823;border-radius:10px} button{background:#a4a92c;border:none;border-radius:10px;padding:10px 14px;color:#0b0f14;font-weight:600;cursor:pointer;margin-top:12px}</style><div class='w'><h1>RAD DAD Log</h1><div class='s' id='head'></div><div><label>Date<input id='date' type='date'></label><label>Day<select id='day'></select></label></div><table><thead><tr><th class='x'>Exercise</th><th>Set</th><th>Weight</th><th>Reps</th></tr></thead><tbody id='tb'></tbody></table><button id='clear'>Clear day</button><div class='s'>Autosaves. 4 sets per exercise.</div></div><script>const LS='rad_dad_log_v4';let S=JSON.parse(localStorage.getItem(LS)||'{}');S.plan=S.plan||[['Bench','Incline DB','DB Shoulder'],['Pulldown','Seated Row','Face Pull'],['Goblet Squat','DB RDL','Calves'],['DB Bench','Pulley Press','Triceps Push'],['Pulldown','Cable Row','Curls'],['Walk','Light Circuit','Core'],['Stretch','Walk','Core']];S.log=S.log||{};const all=['Bench','Incline DB','DB Shoulder','Pulley Press','Triceps Push','Pulldown','Seated Row','Cable Row','Face Pull','Curls','Goblet Squat','DB RDL','Calves','Core','Walk','Light Circuit','Stretch'];const names=['Mon • Push','Tue • Pull','Wed • Legs','Thu • Push','Fri • Pull','Sat • Light','Sun • Recovery'];function save(){localStorage.setItem(LS,JSON.stringify(S))}function log(ds){S.log[ds]=S.log[ds]||{};return S.log[ds]}function val(o,k,def){o[k]=o[k]||def;return o[k]}function render(){const today=new Date();const ds=document.getElementById('date').value||today.toISOString().slice(0,10);document.getElementById('date').value=ds;document.getElementById('head').textContent=today.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});const daySel=document.getElementById('day');daySel.innerHTML='';for(let i=0;i<7;i++){const o=document.createElement('option');o.value=i;o.textContent=names[i];daySel.appendChild(o);}if(!daySel.value)daySel.value=String((today.getDay()+6)%7);const day=Number(daySel.value);const tb=document.getElementById('tb');tb.innerHTML='';const plan=val(S.plan,day,['','','']);for(let e=0;e<plan.length;e++){const key=plan[e];const k=ds+'|'+day+'|'+e;const l=val(log(ds),k,{w:['','','',''],r:['','','','']});const tr=document.createElement('tr');const td=document.createElement('td');td.className='x';const sel=document.createElement('select');sel.style.minWidth='170px';all.forEach(x=>{const op=document.createElement('option');op.value=x;op.textContent=x;if(x===key)op.selected=true;sel.appendChild(op);});sel.onchange=(ev)=>{S.plan[day][e]=ev.target.value;save();render();};td.appendChild(sel);tr.appendChild(td);for(let s=0;s<4;s++){const row=s===0?tr:document.createElement('tr');if(s>0)tb.appendChild(row);if(s>0){row.appendChild(document.createElement('td'));}const tdSet=document.createElement('td');tdSet.className='set';tdSet.textContent=s+1;row.appendChild(tdSet);const tdW=document.createElement('td');const iW=document.createElement('input');iW.placeholder='lbs';iW.value=l.w[s];iW.oninput=(ev)=>{l.w[s]=ev.target.value;save();};tdW.appendChild(iW);row.appendChild(tdW);const tdR=document.createElement('td');const iR=document.createElement('input');iR.placeholder='reps';iR.value=l.r[s];iR.oninput=(ev)=>{l.r[s]=ev.target.value;save();};tdR.appendChild(iR);row.appendChild(tdR);}tb.appendChild(tr);}document.getElementById('clear').onclick=()=>{delete S.log[ds];save();render();};document.getElementById('date').onchange=render;daySel.onchange=render;}window.onload=render;</script>
