<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Rad Dad</title><style>body{margin:0;font-family:sans-serif;background:#111;color:#eee}main{max-width:800px;margin:20px auto;padding:0 12px}section{padding:12px;border:1px solid #333;border-radius:12px;background:#181818}h1{margin:0 0 8px;font-size:32px}label{display:block;margin:10px 0;color:#bbb;font-size:12px;font-weight:700;text-transform:uppercase}input,select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid #333;background:#101010;color:#eee}button{margin-top:10px;padding:10px;border-radius:10px;border:0;background:#f97316;color:#000;font-weight:900;cursor:pointer}#log .item{border:1px solid #333;border-radius:10px;padding:10px;margin:10px 0;background:#101010}.meta{color:#bbb;font-size:12px}</style></head><body><main><section><h1>Rad Dad</h1><p class=meta>No BS workout log. Stored locally.</p><form id=f><label>Date<input id=d type=date required></label><label>Type<select id=t><option>Strength</option><option>Cardio</option><option>Mobility</option><option>Walk</option><option>Other</option></select></label><label>Minutes<input id=m type=number min=1 max=600 required></label><label>Notes<textarea id=n></textarea></label><button type=submit>Save</button></form></section><section style="margin-top:12px"><h2>Stats</h2><p class=meta>Total workouts: <span id=tw>0</span> · Total min: <span id=tm>0</span> · Streak: <span id=st>0</span></p></section><section style="margin-top:12px"><h2>Log</h2><input id=s type=search placeholder="Filter..."><div id=log></div><button id=clr style="background:#e11d48;color:#fee2e2">Clear</button></section></main><script>const K="radDad.v2";const f=document.getElementById("f"),d=document.getElementById("d"),t=document.getElementById("t"),m=document.getElementById("m"),n=document.getElementById("n"),s=document.getElementById("s"),log=document.getElementById("log");d.value=new Date().toISOString().slice(0,10);const load=()=>{try{return JSON.parse(localStorage.getItem(K))||[]}catch{return[]}};const save=x=>localStorage.setItem(K,JSON.stringify(x));const fmt=iso=>new Date(iso+"T00:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});const streak=x=>{const set=new Set(x.map(a=>a.d));let k=0;const cur=new Date();cur.setHours(0,0,0,0);while(set.has(cur.toISOString().slice(0,10))){k++;cur.setDate(cur.getDate()-1)}return k};const render=()=>{const all=load();const q=s.value.trim().toLowerCase();const filtered=all.filter(a=>`${a.t} ${a.m} ${a.n}`.toLowerCase().includes(q)).sort((a,b)=>b.d.localeCompare(a.d));document.getElementById("tw").textContent=all.length;document.getElementById("tm").textContent=all.reduce((p,c)=>p+Number(c.m),0);document.getElementById("st").textContent=streak(all);log.innerHTML=filtered.length?filtered.map(a=>`<div class=item><b>${fmt(a.d)} · ${a.t}</b> · ${a.m} min<div class=meta>${a.n.replace(/[&<>]/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[x]))}</div></div>`).join(""):`<div class=meta>No workouts yet.</div>`;};f.addEventListener("submit",e=>{e.preventDefault();const all=load();all.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),d:d.value,t:t.value,m:Number(m.value),n:n.value.trim()});save(all);f.reset();d.value=new Date().toISOString().slice(0,10);render()});s.addEventListener("input",render);document.getElementById("clr").addEventListener("click",()=>{if(confirm("Clear all workouts?")){save([]);render()}});render();</script></body></html>
